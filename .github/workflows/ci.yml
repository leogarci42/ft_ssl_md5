name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
            sudo apt-get update && sudo apt-get install -y libreadline-dev
            git clone https://github.com/leogarci42/ftest.git

      - name: Build
        run: make

      - name: Unit + CLI tests
        run: make test

      - name: Rebuild with sanitizers
        run: |
          make fclean
          make debug

      - name: Tests under ASan/UBSan
        run: make test

      - name: Restore optimized build artifacts state
        run: make fclean && make
